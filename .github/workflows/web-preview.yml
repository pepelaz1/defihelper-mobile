name: Web Preview Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  typecheck_and_export_web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Export web build
        run: npx expo export --platform web
